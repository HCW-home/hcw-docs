name: Deploy documentation

# Publie le site sur la branche gh-pages à chaque fusion sur main.
# Remplace le `mkdocs gh-deploy` lancé à la main depuis un poste de développeur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the documentation toolchain
        run: pip install -r requirements.txt

      - name: Configure the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish to gh-pages
        run: mkdocs gh-deploy --force
